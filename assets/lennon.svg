<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" role="img" aria-labelledby="title desc">
  <title id="title">Lennon</title>
  <desc id="desc">Lennon, a black wire-haired podenco with one upright ear and one folded ear, silver eyebrows, a shaggy grey beard, and soft, melancholy brown eyes. Drawn from his photographs.</desc>
  <defs>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#353933"/><stop offset=".55" stop-color="#202624"/><stop offset="1" stop-color="#141c1b"/>
    </linearGradient>
    <linearGradient id="beard" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#797a6c"/><stop offset="1" stop-color="#b6b2a0"/>
    </linearGradient>
  </defs>
  <rect width="520" height="560" rx="56" fill="#eee8dc"/>
  <ellipse cx="259" cy="487" rx="139" ry="15" fill="#d8d0c0"/>
